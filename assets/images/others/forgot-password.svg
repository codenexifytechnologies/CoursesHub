<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Reset your password by email">
  <defs>
    <style>
      .float{animation:fl 4.5s ease-in-out infinite}
      .fly{animation:fly 5s ease-in-out infinite}
      .ring{transform-origin:160px 120px;transform-box:view-box;animation:spin 22s linear infinite}
      .dot{animation:blink 1.6s ease-in-out infinite}
      .key{transform-origin:226px 150px;transform-box:view-box;animation:turn 3.2s ease-in-out infinite}
      .trail{stroke-dasharray:6 8;animation:dash 1.4s linear infinite}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
      @keyframes fly{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(10px,-12px) rotate(-6deg)}100%{transform:translate(0,0) rotate(0)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
      @keyframes turn{0%,60%,100%{transform:rotate(0)}75%{transform:rotate(-24deg)}}
      @keyframes dash{to{stroke-dashoffset:-28}}
      @media (prefers-reduced-motion: reduce){.float,.fly,.ring,.dot,.key,.trail{animation:none}}
    </style>
  </defs>
  <ellipse cx="160" cy="222" rx="110" ry="10" fill="#0F3F42" fill-opacity="0.25"/>
  <circle cx="160" cy="120" r="96" fill="#ffffff" fill-opacity="0.10"/>
  <g class="ring">
    <circle cx="160" cy="120" r="106" fill="none" stroke="#F79646" stroke-width="2.5" stroke-dasharray="6 14" stroke-opacity="0.85"/>
  </g>
  <!-- envelope -->
  <g class="float">
    <rect x="86" y="92" width="148" height="100" rx="12" fill="#ffffff"/>
    <path d="M86 104 L160 152 L234 104" fill="none" stroke="#158887" stroke-width="5" stroke-linejoin="round"/>
    <path d="M86 186 L136 140 M234 186 L184 140" stroke="#DCE8E8" stroke-width="4"/>
    <!-- password dots card -->
    <rect x="112" y="58" width="96" height="40" rx="10" fill="#0E6B6A"/>
    <circle class="dot" cx="134" cy="78" r="5" fill="#ffffff"/>
    <circle class="dot" style="animation-delay:.2s" cx="150" cy="78" r="5" fill="#ffffff"/>
    <circle class="dot" style="animation-delay:.4s" cx="166" cy="78" r="5" fill="#ffffff"/>
    <circle class="dot" style="animation-delay:.6s" cx="182" cy="78" r="5" fill="#F79646"/>
  </g>
  <!-- key badge -->
  <g class="key">
    <circle cx="226" cy="150" r="26" fill="#F79646"/>
    <circle cx="218" cy="150" r="8" fill="none" stroke="#0B3B3A" stroke-width="4"/>
    <path d="M226 150 h16 M236 150 v7 M242 150 v5" stroke="#0B3B3A" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- paper plane -->
  <path class="trail" d="M40 64 C70 40 96 40 116 52" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round"/>
  <g class="fly">
    <path d="M20 70 L66 50 L48 88 L42 74 Z" fill="#ffffff"/>
    <path d="M42 74 L66 50 L48 80 Z" fill="#E8F4F4"/>
  </g>
  <!-- check -->
  <g class="float" style="animation-delay:1s">
    <circle cx="96" cy="182" r="18" fill="#ffffff"/>
    <path d="M88 182 l6 6 l11 -12" stroke="#158887" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="#ffffff" class="dot">
    <path d="M268 54 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z"/>
    <path d="M58 140 l2.5 6 l6 2.5 l-6 2.5 l-2.5 6 l-2.5 -6 l-6 -2.5 l6 -2.5 z"/>
  </g>
</svg>
