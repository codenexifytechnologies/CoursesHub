<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <title>CoursesHub terms and conditions</title>
  <style>
    /* Animations run inside the image itself - no JavaScript needed */
    .float-a { animation: floatA 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float-b { animation: floatB 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle { animation: twinkle 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle.d2 { animation-delay: 1.4s; }

    /* checklist ticks draw one after another, then the cycle repeats */
    .tick { stroke-dasharray: 40; stroke-dashoffset: 40; animation: tick 6s ease-in-out infinite; }
    .tick.t2 { animation-delay: 0.6s; }
    .tick.t3 { animation-delay: 1.2s; }
    .tickbox { animation: box 6s ease-in-out infinite; }
    .tickbox.t2 { animation-delay: 0.6s; }
    .tickbox.t3 { animation-delay: 1.2s; }

    /* signature is written by the pen */
    .signature { stroke-dasharray: 260; stroke-dashoffset: 260; animation: sign 6s ease-in-out infinite; }
    .pen { animation: pen 6s ease-in-out infinite; }

    /* verified shield pulses */
    .pulse { animation: pulse 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }

    @keyframes floatA { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes floatB { 0%,100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
    @keyframes twinkle { 0%,100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes tick { 0%,8% { stroke-dashoffset: 40; } 22%,85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 40; } }
    @keyframes box { 0%,8% { fill: #FFFFFF; } 22%,85% { fill: #158887; } 100% { fill: #FFFFFF; } }
    @keyframes sign { 0%,35% { stroke-dashoffset: 260; } 65%,90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 260; } }
    @keyframes pen { 0%,35% { transform: translate(0,0); } 65% { transform: translate(150px,-6px); } 90% { transform: translate(150px,-6px); } 100% { transform: translate(0,0); } }
    @keyframes pulse { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(1.6); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .tick, .signature { stroke-dashoffset: 0; }
      .tickbox { fill: #158887; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#158887"/>
      <stop offset="1" stop-color="#0F3F42"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#FFFFFF" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="720" height="360" fill="url(#bg)"/>
  <circle cx="690" cy="20" r="120" fill="none" stroke="#F79646" stroke-opacity="0.3" stroke-width="24"/>
  <circle cx="20" cy="350" r="110" fill="#FFFFFF" fill-opacity="0.06"/>
  <rect x="590" y="250" width="100" height="80" fill="url(#dots)"/>

  <!-- copy -->
  <g font-family="'Euclid Circular','Segoe UI',Arial,Helvetica,sans-serif">
    <text x="40" y="118" fill="#F79646" font-size="16" font-weight="700" letter-spacing="3">CLEAR &amp; FAIR</text>
    <text x="40" y="166" fill="#FFFFFF" font-size="40" font-weight="700">Terms &amp;</text>
    <text x="40" y="212" fill="#FFFFFF" font-size="40" font-weight="700">Conditions</text>
    <rect x="40" y="232" width="70" height="5" rx="2.5" fill="#F79646"/>
    <text x="40" y="270" fill="#FFFFFF" fill-opacity="0.82" font-size="15">Know your rights and responsibilities</text>
  </g>

  <!-- agreement document -->
  <g class="float-a">
    <g transform="translate(330 40)">
      <rect width="210" height="280" rx="16" fill="#FFFFFF"/>
      <rect x="24" y="26" width="110" height="12" rx="6" fill="#142B30"/>
      <rect x="24" y="48" width="160" height="8" rx="4" fill="#DCE8E8"/>

      <!-- checklist -->
      <g>
        <rect class="tickbox" x="24" y="76" width="22" height="22" rx="6" fill="#FFFFFF" stroke="#158887" stroke-width="2.5"/>
        <path class="tick" d="M29 87 l5 5 9 -10" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="58" y="80" width="126" height="8" rx="4" fill="#DCE8E8"/>
        <rect x="58" y="93" width="90" height="6" rx="3" fill="#E8F0F0"/>
      </g>
      <g transform="translate(0 40)">
        <rect class="tickbox t2" x="24" y="76" width="22" height="22" rx="6" fill="#FFFFFF" stroke="#158887" stroke-width="2.5"/>
        <path class="tick t2" d="M29 87 l5 5 9 -10" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="58" y="80" width="116" height="8" rx="4" fill="#DCE8E8"/>
        <rect x="58" y="93" width="100" height="6" rx="3" fill="#E8F0F0"/>
      </g>
      <g transform="translate(0 80)">
        <rect class="tickbox t3" x="24" y="76" width="22" height="22" rx="6" fill="#FFFFFF" stroke="#158887" stroke-width="2.5"/>
        <path class="tick t3" d="M29 87 l5 5 9 -10" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="58" y="80" width="122" height="8" rx="4" fill="#DCE8E8"/>
        <rect x="58" y="93" width="80" height="6" rx="3" fill="#E8F0F0"/>
      </g>

      <!-- signature line -->
      <line x1="24" y1="252" x2="186" y2="252" stroke="#DCE8E8" stroke-width="2"/>
      <path class="signature" d="M28 244 c12 -22 20 -22 16 0 c-3 14 10 -18 22 -14 c10 4 -4 18 8 14 c12 -4 14 -18 26 -12 c10 6 4 14 16 8 c10 -6 20 -10 30 -4" fill="none" stroke="#0F3F42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- pen -->
      <g class="pen">
        <g transform="translate(18 214) rotate(35)">
          <rect x="0" y="0" width="12" height="48" rx="3" fill="#F79646"/>
          <rect x="0" y="0" width="12" height="10" rx="3" fill="#0F3F42"/>
          <path d="M0 48 L6 60 L12 48 Z" fill="#0F3F42"/>
        </g>
      </g>
    </g>
  </g>

  <!-- verified shield -->
  <g class="float-b">
    <g transform="translate(590 150)">
      <circle class="pulse" r="56" fill="#F79646"/>
      <path d="M0 -56 L46 -38 V-2 C46 30 24 50 0 60 C-24 50 -46 30 -46 -2 V-38 Z" fill="#F79646"/>
      <path d="M0 -42 L34 -28 V-2 C34 22 18 38 0 46 C-18 38 -34 22 -34 -2 V-28 Z" fill="#FFFFFF"/>
      <path d="M-15 2 l10 10 20 -22" fill="none" stroke="#158887" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#FFFFFF">
    <path class="twinkle" d="M300 70 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z"/>
    <path class="twinkle d2" d="M640 300 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <circle class="twinkle d2" cx="290" cy="300" r="5" fill="#F79646"/>
  </g>
</svg>
