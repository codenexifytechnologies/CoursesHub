<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 638 330" width="638" height="330">
  <title>CoursesHub privacy policy</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#158887"/>
      <stop offset="1" stop-color="#0F3F42"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#FFFFFF" fill-opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="638" height="330" fill="url(#bg)"/>
  <circle cx="600" cy="20" r="110" fill="none" stroke="#F79646" stroke-opacity="0.3" stroke-width="22"/>
  <circle cx="20" cy="320" r="100" fill="#FFFFFF" fill-opacity="0.06"/>
  <rect x="520" y="230" width="90" height="72" fill="url(#dots)"/>

  <!-- copy -->
  <g font-family="'Euclid Circular','Segoe UI',Arial,Helvetica,sans-serif">
    <text x="40" y="110" fill="#F79646" font-size="16" font-weight="700" letter-spacing="3">YOUR DATA, PROTECTED</text>
    <text x="40" y="160" fill="#FFFFFF" font-size="42" font-weight="700">Privacy</text>
    <text x="40" y="208" fill="#FFFFFF" font-size="42" font-weight="700">Policy</text>
    <rect x="40" y="228" width="70" height="5" rx="2.5" fill="#F79646"/>
  </g>

  <!-- document -->
  <g transform="translate(330 46)">
    <rect width="170" height="230" rx="14" fill="#FFFFFF"/>
    <rect x="22" y="26" width="90" height="12" rx="6" fill="#142B30"/>
    <rect x="22" y="56" width="126" height="8" rx="4" fill="#DCE8E8"/>
    <rect x="22" y="74" width="110" height="8" rx="4" fill="#DCE8E8"/>
    <rect x="22" y="92" width="126" height="8" rx="4" fill="#DCE8E8"/>
    <rect x="22" y="120" width="70" height="8" rx="4" fill="#B5C4C7"/>
    <rect x="22" y="138" width="120" height="8" rx="4" fill="#DCE8E8"/>
    <rect x="22" y="156" width="96" height="8" rx="4" fill="#DCE8E8"/>
    <!-- lock -->
    <g transform="translate(110 196)">
      <path d="M-12 -6 v-8 a12 12 0 0 1 24 0 v8" fill="none" stroke="#158887" stroke-width="5"/>
      <rect x="-18" y="-6" width="36" height="28" rx="6" fill="#158887"/>
      <circle cy="6" r="4" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- shield -->
  <g transform="translate(540 150)">
    <path d="M0 -70 L54 -50 V-6 C54 34 28 60 0 72 C-28 60 -54 34 -54 -6 V-50 Z" fill="#F79646"/>
    <path d="M0 -54 L40 -39 V-6 C40 24 20 44 0 54 C-20 44 -40 24 -40 -6 V-39 Z" fill="#FFFFFF"/>
    <path d="M-18 0 l12 12 24 -26" fill="none" stroke="#158887" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- sparkles -->
  <g fill="#FFFFFF">
    <path d="M290 60 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" fill-opacity="0.85"/>
    <circle cx="300" cy="260" r="5" fill="#F79646"/>
  </g>
</svg>
