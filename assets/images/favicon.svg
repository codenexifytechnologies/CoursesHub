    <path d="M-92 0 L0 -40 L92 0 L0 40 Z" fill="#F79646"/>
    <path d="M-54 20 V58 C-54 84 54 84 54 58 V20 L0 40 Z" fill="#E07B2C"/>
    <path d="M74 8 V64" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <circle cx="74" cy="72" r="12" fill="#FFFFFF"/>
  </g>
</svg>
