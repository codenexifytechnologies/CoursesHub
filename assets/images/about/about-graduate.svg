<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 530" width="396" height="530">
  <title>Accessible education for every learner</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#158887"/>
      <stop offset="1" stop-color="#0F3F42"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F79646" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F79646" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="396" height="530" fill="url(#bg)"/>
  <circle cx="198" cy="190" r="170" fill="url(#sun)"/>
  <circle cx="198" cy="190" r="96" fill="#F79646" fill-opacity="0.9"/>

  <!-- hills -->
  <path d="M0 400 C 90 350, 170 380, 240 352 S 360 320, 396 340 V530 H0Z" fill="#13615F"/>
  <path d="M0 440 C 110 410, 220 440, 300 410 S 380 400, 396 404 V530 H0Z" fill="#0A2E30"/>

  <!-- graduate figure celebrating -->
  <g transform="translate(198 300)">
    <!-- gown -->
    <path d="M-48 110 C -48 40, -30 10, 0 10 C 30 10, 48 40, 48 110 Z" fill="#0A2E30"/>
    <path d="M-12 10 L0 40 L12 10 Z" fill="#FFFFFF"/>
    <!-- raised arms -->
    <path d="M-30 30 L-74 -42" stroke="#0A2E30" stroke-width="20" stroke-linecap="round"/>
    <path d="M30 30 L74 -42" stroke="#0A2E30" stroke-width="20" stroke-linecap="round"/>
    <circle cx="-76" cy="-48" r="11" fill="#E8B796"/>
    <circle cx="76" cy="-48" r="11" fill="#E8B796"/>
    <!-- head -->
    <circle cy="-14" r="26" fill="#E8B796"/>
    <path d="M-26 -18 c2 -18 50 -18 52 0 c-6 -8 -46 -8 -52 0z" fill="#3A2A22"/><circle cx="-9" cy="-14" r="2.6" fill="#3A2A22"/><circle cx="9" cy="-14" r="2.6" fill="#3A2A22"/><path d="M-9 -2 q9 9 18 0" fill="none" stroke="#3A2A22" stroke-width="3" stroke-linecap="round"/>
    <!-- cap on head -->
    <path d="M-36 -36 L0 -52 L36 -36 L0 -20 Z" fill="#0F3F42"/>
    <path d="M28 -34 v18" stroke="#F79646" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="28" cy="-13" r="4" fill="#F79646"/>
    <!-- diploma -->
    <g transform="translate(92 -70) rotate(30)">
      <rect x="-8" y="-30" width="16" height="60" rx="8" fill="#FFFFFF"/>
      <rect x="-9" y="-4" width="18" height="6" fill="#F79646"/>
    </g>
  </g>

  <!-- flying cap -->
  <g transform="translate(86 104) rotate(-18)">
    <path d="M-30 0 L0 -13 L30 0 L0 13 Z" fill="#FFFFFF"/>
    <path d="M-17 6 v11 c0 7 34 7 34 0 v-11 L0 13 Z" fill="#E8F4F4"/>
  </g>

  <!-- confetti -->
  <g>
    <rect x="300" y="80" width="10" height="10" fill="#FFFFFF" transform="rotate(20 305 85)"/>
    <rect x="60" y="200" width="8" height="8" fill="#F79646" transform="rotate(35 64 204)"/>
    <rect x="330" y="230" width="8" height="8" fill="#E8F4F4" transform="rotate(-15 334 234)"/>
    <circle cx="130" cy="60" r="5" fill="#FFFFFF" fill-opacity="0.8"/>
    <circle cx="280" cy="150" r="4" fill="#FFFFFF" fill-opacity="0.7"/>
    <path d="M330 40 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" fill="#FFFFFF" fill-opacity="0.85"/>
  </g>
</svg>
