<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 490" width="405" height="490">
  <title>Expert guidance from the CoursesHub team</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8F4F4"/>
      <stop offset="1" stop-color="#D3ECEB"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#158887" fill-opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="405" height="490" fill="url(#bg)"/>
  <circle cx="380" cy="470" r="130" fill="#158887" fill-opacity="0.1"/>
  <rect x="290" y="24" width="90" height="72" fill="url(#dots)"/>

  <!-- advisor -->
  <g transform="translate(110 330)">
    <circle r="80" fill="#158887"/>
    <circle cy="-14" r="30" fill="#F5D5BC"/>
    <path d="M-30 -16 C-32 -46 32 -46 30 -16 C24 -30 -24 -30 -30 -16Z" fill="#0F3F42"/><circle cx="-10" cy="-12" r="3" fill="#0F3F42"/><circle cx="10" cy="-12" r="3" fill="#0F3F42"/><path d="M-9 0 q9 8 18 0" fill="none" stroke="#0F3F42" stroke-width="3" stroke-linecap="round"/>
    <path d="M-52 62 c0 -40 104 -40 104 0" fill="#0F3F42"/>
    <!-- headset -->
    <path d="M-34 -14 c0 -42 68 -42 68 0" fill="none" stroke="#F79646" stroke-width="6" stroke-linecap="round"/>
    <rect x="-40" y="-20" width="12" height="20" rx="5" fill="#F79646"/>
    <rect x="28" y="-20" width="12" height="20" rx="5" fill="#F79646"/>
    <path d="M34 0 c0 14 -12 20 -26 20" fill="none" stroke="#F79646" stroke-width="4" stroke-linecap="round"/>
    <circle cx="6" cy="20" r="4" fill="#F79646"/>
  </g>

  <!-- chat bubbles -->
  <g font-family="'Euclid Circular','Segoe UI',Arial,sans-serif">
    <g transform="translate(36 54)">
      <rect width="210" height="74" rx="16" fill="#FFFFFF"/>
      <path d="M30 74 l0 18 l18 -18z" fill="#FFFFFF"/>
      <text x="18" y="32" font-size="15" font-weight="700" fill="#142B30">Which course suits me?</text>
      <rect x="18" y="46" width="130" height="8" rx="4" fill="#DCE8E8"/>
    </g>
    <g transform="translate(150 158)">
      <rect width="222" height="96" rx="16" fill="#158887"/>
      <path d="M190 96 l0 18 l-18 -18z" fill="#158887"/>
      <text x="18" y="32" font-size="15" font-weight="700" fill="#FFFFFF">Let's find your path</text>
      <rect x="18" y="46" width="170" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.55"/>
      <rect x="18" y="64" width="120" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.55"/>
    </g>
  </g>

  <!-- compass -->
  <g transform="translate(300 360)">
    <circle r="52" fill="#FFFFFF"/>
    <circle r="42" fill="none" stroke="#DCE8E8" stroke-width="4"/>
    <path d="M0 -30 L10 0 L0 30 L-10 0 Z" fill="#F79646"/>
    <path d="M0 0 L10 0 L0 30 L-10 0 Z" fill="#158887"/>
    <circle r="5" fill="#0F3F42"/>
  </g>
</svg>
