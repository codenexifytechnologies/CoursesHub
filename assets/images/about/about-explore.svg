<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 530" width="396" height="530">
  <title>Explore and compare courses on CoursesHub</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#158887"/>
      <stop offset="1" stop-color="#0F3F42"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#FFFFFF" fill-opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="396" height="530" fill="url(#bg)"/>
  <circle cx="360" cy="40" r="110" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="20" cy="510" r="120" fill="none" stroke="#F79646" stroke-opacity="0.35" stroke-width="22"/>
  <rect x="20" y="20" width="90" height="72" fill="url(#dots)"/>

  <!-- phone -->
  <g transform="translate(78 60)">
    <rect x="0" y="0" width="240" height="420" rx="30" fill="#0A2E30"/>
    <rect x="10" y="10" width="220" height="400" rx="22" fill="#F5FAFA"/>
    <rect x="90" y="18" width="60" height="8" rx="4" fill="#0A2E30" fill-opacity="0.25"/>

    <!-- app header -->
    <text x="26" y="58" font-family="'Euclid Circular','Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#158887">Courses<tspan fill="#F79646">Hub</tspan></text>
    <!-- search -->
    <rect x="24" y="72" width="192" height="34" rx="8" fill="#FFFFFF" stroke="#DCE8E8" stroke-width="2"/>
    <circle cx="42" cy="89" r="7" fill="none" stroke="#158887" stroke-width="2.5"/>
    <path d="M47 94l5 5" stroke="#158887" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="58" y="85" width="90" height="8" rx="4" fill="#C9D6D8"/>

    <!-- filter chips -->
    <rect x="24" y="116" width="56" height="22" fill="#158887"/>
    <rect x="86" y="116" width="56" height="22" fill="#FFFFFF" stroke="#DCE8E8" stroke-width="1.5"/>
    <rect x="148" y="116" width="56" height="22" fill="#FFFFFF" stroke="#DCE8E8" stroke-width="1.5"/>
    <rect x="34" y="124" width="36" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="96" y="124" width="36" height="6" rx="3" fill="#C9D6D8"/>
    <rect x="158" y="124" width="36" height="6" rx="3" fill="#C9D6D8"/>

    <!-- course cards -->
    <g>
      <rect x="24" y="150" width="192" height="72" rx="10" fill="#FFFFFF" stroke="#DCE8E8" stroke-width="1.5"/>
      <rect x="34" y="160" width="52" height="52" rx="8" fill="#E8F4F4"/>
      <path d="M46 186 L60 179 L74 186 L60 193 Z" fill="#158887"/>
      <rect x="96" y="164" width="100" height="9" rx="4" fill="#142B30"/>
      <rect x="96" y="180" width="72" height="7" rx="3.5" fill="#B5C4C7"/>
      <rect x="96" y="196" width="44" height="14" rx="7" fill="#FEF3EA"/>
      <rect x="102" y="201" width="32" height="4" rx="2" fill="#E07B2C"/>
    </g>
    <g transform="translate(0 84)">
      <rect x="24" y="150" width="192" height="72" rx="10" fill="#FFFFFF" stroke="#F79646" stroke-width="2"/>
      <rect x="34" y="160" width="52" height="52" rx="8" fill="#FEF3EA"/>
      <g fill="none" stroke="#E07B2C" stroke-width="3" stroke-linejoin="round">
        <path d="M46 180 c6 -3 11 -3 14 0 v16 c-3 -3 -8 -3 -14 0 z"/>
        <path d="M74 180 c-6 -3 -11 -3 -14 0 v16 c3 -3 8 -3 14 0 z"/>
      </g>
      <rect x="96" y="164" width="92" height="9" rx="4" fill="#142B30"/>
      <rect x="96" y="180" width="80" height="7" rx="3.5" fill="#B5C4C7"/>
      <rect x="96" y="196" width="44" height="14" rx="7" fill="#E8F4F4"/>
      <rect x="102" y="201" width="32" height="4" rx="2" fill="#158887"/>
    </g>
    <g transform="translate(0 168)">
      <rect x="24" y="150" width="192" height="72" rx="10" fill="#FFFFFF" stroke="#DCE8E8" stroke-width="1.5"/>
      <rect x="34" y="160" width="52" height="52" rx="8" fill="#E8F4F4"/>
      <rect x="47" y="176" width="26" height="20" rx="3" fill="none" stroke="#158887" stroke-width="3"/>
      <path d="M54 176v-4h12v4" fill="none" stroke="#158887" stroke-width="3"/>
      <rect x="96" y="164" width="104" height="9" rx="4" fill="#142B30"/>
      <rect x="96" y="180" width="64" height="7" rx="3.5" fill="#B5C4C7"/>
      <rect x="96" y="196" width="44" height="14" rx="7" fill="#E8F4F4"/>
      <rect x="102" y="201" width="32" height="4" rx="2" fill="#158887"/>
    </g>
  </g>

  <!-- compare badge -->
  <g transform="translate(300 300)">
    <circle r="38" fill="#F79646"/>
    <g fill="none" stroke="#0B3B3A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-16 -8 h28 l-7 -7"/>
      <path d="M16 8 h-28 l7 7"/>
    </g>
  </g>
  <!-- star rating chip -->
  <g transform="translate(150 486)">
    <rect width="96" height="34" rx="17" fill="#FFFFFF"/>
    <g fill="#F79646">
      <path d="M18 9 l3 6 6.5 1 -4.7 4.5 1.1 6.5 -5.9 -3.1 -5.9 3.1 1.1 -6.5 -4.7 -4.5 6.5 -1z"/>
    </g>
    <rect x="34" y="13" width="48" height="8" rx="4" fill="#158887"/>
  </g>
</svg>
