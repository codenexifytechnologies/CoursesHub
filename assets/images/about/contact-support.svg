<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="500" height="550">
  <title>Get in touch with CoursesHub</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#158887"/>
      <stop offset="1" stop-color="#0F3F42"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3FA3A2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3FA3A2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#FFFFFF" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="500" height="550" fill="url(#bg)"/>
  <circle cx="250" cy="300" r="230" fill="url(#glow)"/>
  <circle cx="470" cy="30" r="110" fill="none" stroke="#F79646" stroke-opacity="0.3" stroke-width="22"/>
  <circle cx="20" cy="530" r="120" fill="#FFFFFF" fill-opacity="0.05"/>
  <rect x="28" y="28" width="108" height="72" fill="url(#dots)"/>
  <rect x="380" y="440" width="90" height="90" fill="url(#dots)"/>

  <!-- heading -->
  <g font-family="'Euclid Circular','Segoe UI',Arial,Helvetica,sans-serif">
    <text x="40" y="150" fill="#F79646" font-size="18" font-weight="700" letter-spacing="4">CONTACT US</text>
    <text x="40" y="196" fill="#FFFFFF" font-size="38" font-weight="700">We're here</text>
    <text x="40" y="240" fill="#FFFFFF" font-size="38" font-weight="700">to <tspan fill="#F79646">help.</tspan></text>
  </g>

  <!-- envelope card -->
  <g transform="translate(70 290)">
    <rect width="250" height="170" rx="18" fill="#FFFFFF"/>
    <path d="M0 18 a18 18 0 0 1 18 -18 h214 a18 18 0 0 1 18 18 L125 96 Z" fill="#E8F4F4"/>
    <path d="M14 14 L125 86 L236 14" fill="none" stroke="#158887" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="30" y="118" width="120" height="10" rx="5" fill="#DCE8E8"/>
    <rect x="30" y="138" width="80" height="10" rx="5" fill="#DCE8E8"/>
    <!-- sent badge -->
    <g transform="translate(222 150)">
      <circle r="28" fill="#F79646"/>
      <path d="M-11 0 l7 7 15 -15" fill="none" stroke="#0B3B3A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- chat bubble -->
  <g transform="translate(300 220)">
    <rect width="150" height="84" rx="18" fill="#F79646"/>
    <path d="M30 84 l0 20 l20 -20z" fill="#F79646"/>
    <circle cx="45" cy="42" r="8" fill="#0B3B3A"/>
    <circle cx="75" cy="42" r="8" fill="#0B3B3A"/>
    <circle cx="105" cy="42" r="8" fill="#0B3B3A"/>
  </g>

  <!-- phone -->
  <g transform="translate(400 380)">
    <circle r="40" fill="#FFFFFF"/>
    <path d="M-14 -18 c4 -4 9 -4 11 0 l5 9 c2 4 0 7 -3 9 l-3 2 c3 7 8 12 15 15 l2 -3 c2 -3 5 -5 9 -3 l9 5 c4 2 4 7 0 11 l-5 5 c-6 6 -22 0 -35 -13 s-19 -29 -13 -35z" fill="#158887"/>
  </g>

  <!-- location pin -->
  <g transform="translate(70 500)">
    <rect x="-2" y="-30" width="210" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.12"/>
    <path d="M16 6 C 4 -8 4 -12 4 -14 a12 12 0 0 1 24 0 c0 2 0 6 -12 20z" fill="#F79646"/>
    <circle cx="16" cy="-14" r="4.5" fill="#0F3F42"/>
    <text x="40" y="-2" fill="#FFFFFF" font-family="'Euclid Circular','Segoe UI',Arial,sans-serif" font-size="16" font-weight="600">Adelaide, SA</text>
  </g>

  <!-- sparkles -->
  <g fill="#FFFFFF">
    <path d="M410 120 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" fill-opacity="0.85"/>
    <path d="M46 300 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill-opacity="0.6"/>
    <circle cx="290" cy="150" r="5" fill="#F79646"/>
  </g>
</svg>
