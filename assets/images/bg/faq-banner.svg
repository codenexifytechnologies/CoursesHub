<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 340" width="1600" height="340" preserveAspectRatio="xMidYMid slice">
  <title>CoursesHub FAQ</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F4F4"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FEF3EA"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#158887" fill-opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1600" height="340" fill="url(#bg)"/>
  <rect x="470" y="30" width="110" height="72" fill="url(#dots)"/>
  <rect x="1030" y="240" width="110" height="72" fill="url(#dots)"/>

  <!-- left cluster: question bubbles -->
  <g transform="translate(250 170)">
    <circle r="150" fill="#158887" fill-opacity="0.07"/>
    <g transform="translate(-70 -40)">
      <rect x="-70" y="-50" width="140" height="100" rx="24" fill="#158887"/>
      <path d="M-40 50 l0 26 l26 -26z" fill="#158887"/>
      <text x="0" y="24" text-anchor="middle" font-family="'Euclid Circular','Segoe UI',Arial,sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">?</text>
    </g>
    <g transform="translate(80 40)">
      <rect x="-56" y="-40" width="112" height="80" rx="20" fill="#F79646"/>
      <path d="M30 40 l0 22 l-22 -22z" fill="#F79646"/>
      <circle cx="-24" cy="0" r="8" fill="#0B3B3A"/>
      <circle cx="0" cy="0" r="8" fill="#0B3B3A"/>
      <circle cx="24" cy="0" r="8" fill="#0B3B3A"/>
    </g>
    <path d="M-150 90 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" fill="#F79646"/>
  </g>

  <!-- right cluster: lightbulb answer -->
  <g transform="translate(1350 170)">
    <circle r="150" fill="#F79646" fill-opacity="0.08"/>
    <g transform="translate(-20 -6)">
      <circle r="74" fill="#FFFFFF"/>
      <circle r="74" fill="none" stroke="#158887" stroke-width="5"/>
      <path d="M-22 18 C-40 2 -40 -34 0 -40 C40 -34 40 2 22 18 V30 H-22 Z" fill="#F79646"/>
      <rect x="-20" y="34" width="40" height="8" rx="4" fill="#0F3F42"/>
      <rect x="-14" y="46" width="28" height="8" rx="4" fill="#0F3F42"/>
      <path d="M-8 -6 l8 10 8 -10" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g stroke="#158887" stroke-width="6" stroke-linecap="round">
      <path d="M-20 -104 v-18"/>
      <path d="M48 -82 l12 -12"/>
      <path d="M-88 -82 l-12 -12"/>
    </g>
    <g transform="translate(100 70)">
      <circle r="30" fill="#158887"/>
      <path d="M-12 0 l8 8 16 -16" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M130 -90 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#158887"/>
  </g>
</svg>
